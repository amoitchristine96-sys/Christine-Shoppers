<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products – Christine Shoppers</title>
  <meta name="theme-color" content="#f68b1e" />
  <meta name="description" content="Browse electronics, fashion, beauty and home products at Christine Shoppers Uganda." />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body id="products" data-nav="products">
  <div id="site-topbar"></div>
  <div id="site-header"></div>

  <section class="page-banner">
    <div class="container">
      <nav class="breadcrumb"><a href="index.html">Home</a> / Products</nav>
      <h1>Shop All Products</h1>
      <p>Fridges, TVs, blenders, jeans, t-shirts, cosmetics and more.</p>
    </div>
  </section>

  <main class="container pb-5 products-layout">
    <aside class="filter-sidebar">
      <h5><i class="fa-solid fa-sliders me-2"></i>Filters</h5>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" value="Electronics" id="filterElectronics" checked>
        <label class="form-check-label" for="filterElectronics">Electronics</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" value="Fashion" id="filterFashion" checked>
        <label class="form-check-label" for="filterFashion">Fashion</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" value="Home" id="filterHome" checked>
        <label class="form-check-label" for="filterHome">Home &amp; Kitchen</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" value="Beauty" id="filterBeauty" checked>
        <label class="form-check-label" for="filterBeauty">Beauty</label>
      </div>
    </aside>
    <div class="product-grid flex-grow-1">
      <div id="productGrid" class="row g-4"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <div class="modal fade" id="quickViewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Product Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body row g-4">
          <div class="col-md-5"><img id="quickViewImg" src="" alt="" class="img-fluid w-100 rounded" /></div>
          <div class="col-md-7">
            <h4 id="quickViewTitle" class="fw-bold"></h4>
            <p id="quickViewPrice" class="card-price fs-4"></p>
            <p id="quickViewDesc" class="text-muted">Quality product with fast delivery across Uganda.</p>
            <button class="btn btn-primary add-to-cart" id="quickViewAddBtn"><i class="fa-solid fa-cart-plus me-1"></i> Add to Cart</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="layout.js"></script>
  <script src="products-data.js"></script>
  <script src="script.js"></script>
</body>
</html>

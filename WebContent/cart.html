<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart – Christine Shoppers</title>
  <meta name="theme-color" content="#f68b1e" />
  <meta name="description" content="Review your cart and checkout at Christine Shoppers." />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
</head>
<body id="cart" data-nav="cart">
  <div id="site-topbar"></div>
  <div id="site-header"></div>

  <section class="page-banner">
    <div class="container">
      <nav class="breadcrumb"><a href="index.html">Home</a> / Cart</nav>
      <h1>Your Shopping Cart</h1>
      <p>Review your items before checkout.</p>
    </div>
  </section>

  <main class="container pb-5">
    <div class="row g-4">
      <div class="col-lg-8">
        <div id="cartItems"></div>
        <a href="products.html" class="btn btn-outline-primary mt-2">
          <i class="fa-solid fa-arrow-left me-1"></i> Continue Shopping
        </a>
      </div>
      <div class="col-lg-4">
        <div class="content-card cart-summary">
          <h4 class="mb-3">Order Summary</h4>
          <div class="summary-row"><span>Subtotal</span><span id="cartSubtotal">UGX 0</span></div>
          <div class="summary-row"><span>Delivery (Kampala)</span><span class="text-success">Free</span></div>
          <div class="summary-row total"><span>Total</span><span id="cartTotal">UGX 0</span></div>
          <a href="checkout.html" class="btn btn-primary w-100 mt-3 py-2">
            Proceed to Checkout <i class="fa-solid fa-arrow-right ms-1"></i>
          </a>
          <p class="text-muted small text-center mt-3 mb-0">
            <i class="fa-solid fa-lock me-1"></i> Secure checkout
          </p>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="layout.js"></script>
  <script src="script.js"></script>
  <script src="pages.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const syncSummary = () => {
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const total = cart.reduce((s, i) => s + (i.price || 0), 0);
        const fmt = (n) => 'UGX ' + n.toLocaleString('en-UG');
        const sub = document.getElementById('cartSubtotal');
        if (sub) sub.textContent = fmt(total);
      };
      setTimeout(syncSummary, 100);
      const obs = new MutationObserver(syncSummary);
      const totalEl = document.getElementById('cartTotal');
      if (totalEl) obs.observe(totalEl, { childList: true, characterData: true, subtree: true });
    });
  </script>
</body>
</html>

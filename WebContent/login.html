<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – Christine Shoppers</title>
  <meta name="theme-color" content="#f68b1e" />
  <meta name="description" content="Sign in to your Christine Shoppers account." />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
</head>
<body id="login" data-nav="login">
  <div id="site-topbar"></div>
  <div id="site-header"></div>

  <section class="page-banner">
    <div class="container">
      <nav class="breadcrumb"><a href="index.html">Home</a> / Sign In</nav>
      <h1>Welcome Back</h1>
      <p>Sign in to track orders and save your favourites.</p>
    </div>
  </section>

  <main class="container pb-5">
    <div class="auth-card">
      <div class="content-card">
        <div class="text-center mb-4">
          <i class="fa-solid fa-user-circle fa-3x text-primary mb-2"></i>
          <h3 class="mb-0">Sign In</h3>
        </div>
        <form id="loginForm">
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" placeholder="you@example.com" required />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="••••••••" required />
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" />
              <label class="form-check-label small" for="remember">Remember me</label>
            </div>
            <a href="#" class="small">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
        </form>
        <p class="auth-divider">— or —</p>
        <p class="text-center text-muted small mb-0">
          Don't have an account? <a href="user.html">Create one</a>
        </p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="layout.js"></script>
  <script src="script.js"></script>
  <script src="pages.js"></script>
</body>
</html>

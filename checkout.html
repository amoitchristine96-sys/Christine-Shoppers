<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout – Christine Shoppers</title>
  <meta name="theme-color" content="#f68b1e" />
  <meta name="description" content="Complete your purchase at Christine Shoppers Uganda." />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
</head>
<body id="checkout" data-nav="checkout">
  <div id="site-topbar"></div>
  <div id="site-header"></div>

  <section class="page-banner">
    <div class="container">
      <nav class="breadcrumb"><a href="index.html">Home</a> / <a href="cart.html">Cart</a> / Checkout</nav>
      <h1>Checkout</h1>
      <p>Complete your order — fast delivery across Uganda.</p>
    </div>
  </section>

  <main class="container pb-5">
    <div class="checkout-steps">
      <div class="checkout-step done"><i class="fa-solid fa-cart-shopping"></i> Cart</div>
      <div class="checkout-step active"><i class="fa-solid fa-credit-card"></i> Payment</div>
      <div class="checkout-step"><i class="fa-solid fa-check"></i> Done</div>
    </div>

    <div class="row g-4">
      <div class="col-lg-7">
        <div class="content-card mb-4">
          <h4 class="mb-3"><i class="fa-solid fa-truck me-2 text-primary"></i> Delivery Details</h4>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" placeholder="John Doe" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-control" placeholder="+256 7XX XXX XXX" required />
            </div>
            <div class="col-12">
              <label class="form-label">Delivery Address</label>
              <input type="text" class="form-control" placeholder="Street, area, city" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">District</label>
              <select class="form-select">
                <option>Kampala</option>
                <option>Wakiso</option>
                <option>Mukono</option>
                <option>Other</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Delivery Notes</label>
              <input type="text" class="form-control" placeholder="Optional" />
            </div>
          </div>
        </div>

        <div class="content-card">
          <h4 class="mb-3"><i class="fa-solid fa-credit-card me-2 text-primary"></i> Payment Details</h4>
          <form id="paymentForm">
            <div class="mb-3">
              <label class="form-label">Payment Method</label>
              <select class="form-select mb-3">
                <option>Mobile Money (MTN / Airtel)</option>
                <option>Visa / Mastercard</option>
                <option>Cash on Delivery</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="cardName" class="form-label">Name on Card / Mobile Money</label>
              <input type="text" class="form-control" id="cardName" required />
            </div>
            <div class="mb-3">
              <label for="cardNumber" class="form-label">Card / Phone Number</label>
              <input type="text" class="form-control" id="cardNumber" placeholder="1234 5678 9012 3456" required />
            </div>
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="expDate" class="form-label">Expiry (MM/YY)</label>
                <input type="text" class="form-control" id="expDate" placeholder="MM/YY" />
              </div>
              <div class="col-md-6">
                <label for="cvc" class="form-label">CVC</label>
                <input type="text" class="form-control" id="cvc" placeholder="123" />
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 py-2">
              <i class="fa-solid fa-lock me-2"></i>Place Order
            </button>
          </form>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="content-card cart-summary">
          <h4 class="mb-3">Order Summary</h4>
          <ul id="orderItems" class="list-group list-group-flush mb-3"></ul>
          <div class="summary-row"><span>Delivery</span><span class="text-success">Free</span></div>
          <div class="summary-row total"><span>Total</span><span id="orderTotal">UGX 0</span></div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="layout.js"></script>
  <script src="script.js"></script>
  <script src="pages.js"></script>
</body>
</html>

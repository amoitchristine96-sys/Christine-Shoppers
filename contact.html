<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us – Christine Shoppers</title>
  <meta name="theme-color" content="#f68b1e" />
  <meta name="description" content="Contact Christine Shoppers – support, orders and partnerships in Uganda." />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
</head>
<body id="contact" data-nav="contact">
  <div id="site-topbar"></div>
  <div id="site-header"></div>

  <section class="page-banner">
    <div class="container">
      <nav class="breadcrumb"><a href="index.html">Home</a> / Contact</nav>
      <h1>Get In Touch</h1>
      <p>Questions about orders, products or delivery? We're here to help.</p>
    </div>
  </section>

  <main class="container pb-5">
    <div class="row g-4">
      <div class="col-lg-5">
        <div class="content-card h-100">
          <h3 class="mb-4">Contact Information</h3>
          <div class="contact-info-item">
            <i class="fa-solid fa-location-dot"></i>
            <div>
              <strong>Address</strong>
              <p class="text-muted mb-0 small">Plot 12, Kampala Road, Kampala, Uganda</p>
            </div>
          </div>
          <div class="contact-info-item">
            <i class="fa-solid fa-phone"></i>
            <div>
              <strong>Phone</strong>
              <p class="text-muted mb-0 small">+256 700 123 456</p>
            </div>
          </div>
          <div class="contact-info-item">
            <i class="fa-solid fa-envelope"></i>
            <div>
              <strong>Email</strong>
              <p class="text-muted mb-0 small">support@christineshoppers.ug</p>
            </div>
          </div>
          <div class="contact-info-item mb-0">
            <i class="fa-brands fa-whatsapp"></i>
            <div>
              <strong>WhatsApp</strong>
              <p class="text-muted mb-0 small">Mon–Sat, 8am – 8pm EAT</p>
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-7">
        <div class="content-card">
          <h3 class="mb-4">Send a Message</h3>
          <form id="contactForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" placeholder="Your name" required />
              </div>
              <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="you@example.com" required />
              </div>
              <div class="col-12">
                <label for="subject" class="form-label">Subject</label>
                <select class="form-select" id="subject">
                  <option>Order enquiry</option>
                  <option>Product question</option>
                  <option>Delivery issue</option>
                  <option>Partnership</option>
                  <option>Other</option>
                </select>
              </div>
              <div class="col-12">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" rows="5" placeholder="How can we help?" required></textarea>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary w-100 py-2">
                  <i class="fa-solid fa-paper-plane me-2"></i>Send Message
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="layout.js"></script>
  <script src="script.js"></script>
  <script src="pages.js"></script>
</body>
</html>
